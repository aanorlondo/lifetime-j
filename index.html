<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compteur de vie 👶</title>
    <!-- Import des polices pastel + Polices Metal lisibles (New Rocker & Metal Mania) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Concert+One&family=Fredoka:wght@600&family=Gaegu:wght@700&family=Metal+Mania&family=New+Rocker&family=Patrick+Hand&family=Sniglet:wght@800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1 class="title">Depuis ta venue au monde...</h1>

      <div class="heart-container">
        <span id="heart">❤️</span>
      </div>

      <div class="grid">
        <div class="card">
          <span class="number" id="years">0</span>
          <span class="label">Ans</span>
        </div>
        <div class="card">
          <span class="number" id="months">0</span>
          <span class="label">Mois</span>
        </div>
        <div class="card">
          <span class="number" id="days">0</span>
          <span class="label">Jours</span>
        </div>
        <div class="card">
          <span class="number" id="hours">0</span>
          <span class="label">Heures</span>
        </div>
        <div class="card">
          <span class="number" id="minutes">0</span>
          <span class="label">Minutes</span>
        </div>
        <div class="card">
          <span class="number" id="seconds">0</span>
          <span class="label">Secondes</span>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
